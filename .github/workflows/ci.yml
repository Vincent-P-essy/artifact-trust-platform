name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked environment
        run: uv sync --locked --extra dev
      - name: Static validation
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests
          uv run mypy src
      - name: Validate Rego policy
        run: |
          docker run --rm --network none --read-only \
            --volume "$PWD/src/artifact_trust/data:/policy:ro" \
            openpolicyagent/opa@sha256:57f7d06808fff6de3ea1d698e6430990973ca1370be0e54975f0083d615521da \
            check --strict /policy/policy.rego /policy/policy_test.rego
          docker run --rm --network none --read-only \
            --volume "$PWD/src/artifact_trust/data:/policy:ro" \
            openpolicyagent/opa@sha256:57f7d06808fff6de3ea1d698e6430990973ca1370be0e54975f0083d615521da \
            test /policy/policy.rego /policy/policy_test.rego
      - name: Tests and branch coverage
        run: uv run pytest --cov=artifact_trust --cov-report=term-missing --cov-report=xml
      - name: Controlled tamper gate
        env:
          ATP_PRIVATE_KEY: tests/keys/test-signing-key.pem
          ATP_PUBLIC_KEY: tests/keys/test-verification-key.pem
          ATP_WORK_ROOT: ${{ runner.temp }}/artifact-trust
        run: uv run artifact-trust attack safe-app --output "${{ runner.temp }}/attack"
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate Compose deployment
        run: docker compose config --quiet

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build hardened runtime image
        run: docker build --tag artifact-trust-platform:ci .
      - name: Inspect runtime identity
        run: |
          test "$(docker image inspect artifact-trust-platform:ci --format '{{.Config.User}}')" = "10001:10001"
