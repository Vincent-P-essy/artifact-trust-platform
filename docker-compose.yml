services:
  volume-init:
    image: artifact-trust-platform:local
    build:
      context: .
      target: runtime
    command:
      - sh
      - -ec
      - |
        install -d -o 0 -g 10000 -m 0755 /mnt/queue
        install -d -o 10001 -g 10000 -m 0770 /mnt/queue/pending
        install -d -o 10002 -g 10002 -m 0755 /mnt/queue/running /mnt/queue/completed /mnt/queue/failed
        install -d -o 10002 -g 10000 -m 0700 /mnt/queue/sources
        install -d -o 10002 -g 10000 -m 0770 /mnt/results
        install -d -o 10002 -g 10000 -m 0700 /mnt/private
        install -d -o 10002 -g 10000 -m 0770 /mnt/public
    user: "0:0"
    volumes:
      - type: volume
        source: artifact-trust-queue
        target: /mnt/queue
        volume:
          nocopy: true
      - type: volume
        source: artifact-trust-results
        target: /mnt/results
        volume:
          nocopy: true
      - type: volume
        source: artifact-trust-private
        target: /mnt/private
        volume:
          nocopy: true
      - type: volume
        source: artifact-trust-public
        target: /mnt/public
        volume:
          nocopy: true
    read_only: true
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    image: artifact-trust-platform:local
    command: ["artifact-trust", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ATP_ALLOW_NETWORK: "0"
      ATP_WORK_ROOT: /var/lib/artifact-trust
      ATP_FIXTURES_ROOT: /app/fixtures
      ATP_PUBLIC_KEY: /var/lib/artifact-trust-public/verification-key.pem
    ports:
      - "127.0.0.1:${ATP_PORT:-8000}:8000"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: artifact-trust-queue
        target: /var/lib/artifact-trust
        volume:
          nocopy: true
      - type: volume
        source: artifact-trust-results
        target: /var/lib/artifact-trust/results
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: artifact-trust-public
        target: /var/lib/artifact-trust-public
        read_only: true
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    image: artifact-trust-platform:local
    build:
      context: .
      target: runtime
    command: ["artifact-trust", "worker", "--poll-seconds", "1"]
    user: "10002:10000"
    depends_on:
      volume-init:
        condition: service_completed_successfully
    environment:
      ATP_ALLOW_NETWORK: "0"
      ATP_WORK_ROOT: /var/lib/artifact-trust
      ATP_FIXTURES_ROOT: /app/fixtures
      ATP_CPU_SECONDS: "30"
      ATP_MEMORY_MB: "512"
      ATP_MAX_PIDS: "64"
      ATP_PRIVATE_KEY: /var/lib/artifact-trust-private/signing-key.pem
      ATP_PUBLIC_KEY: /var/lib/artifact-trust-public/verification-key.pem
    volumes:
      - type: volume
        source: artifact-trust-queue
        target: /var/lib/artifact-trust
        volume:
          nocopy: true
      - type: volume
        source: artifact-trust-results
        target: /var/lib/artifact-trust/results
        volume:
          nocopy: true
      - type: volume
        source: artifact-trust-private
        target: /var/lib/artifact-trust-private
        volume:
          nocopy: true
      - type: volume
        source: artifact-trust-public
        target: /var/lib/artifact-trust-public
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
      - /var/lib/artifact-trust/sources:rw,noexec,nosuid,nodev,size=128m,mode=0770,uid=10002,gid=10000
    network_mode: none
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    cpus: 1.00
    restart: unless-stopped

volumes:
  artifact-trust-queue:
  artifact-trust-results:
  artifact-trust-private:
  artifact-trust-public:
